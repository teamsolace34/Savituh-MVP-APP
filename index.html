<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Savitu - Hardware Breathing Simulator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel UMD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.4/babel.min.js" crossorigin></script>
  
  <style>
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2s infinite ease-in-out;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-black text-white selection:bg-orange-500 selection:text-black font-sans antialiased overflow-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
      const angleInRadians = (angleInDegrees - 90) * (Math.PI / 180.0);
      return {
        x: centerX + radius * Math.cos(angleInRadians),
        y: centerY + radius * Math.sin(angleInRadians)
      };
    };

    const describeArc = (x, y, radius, startAngle, endAngle) => {
      const start = polarToCartesian(x, y, radius, endAngle);
      const end = polarToCartesian(x, y, radius, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return [
        "M", start.x, start.y,
        "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y
      ].join(" ");
    };

    const ROUTINES = {
      recharge: {
        id: 'recharge',
        title: 'Morning - Recharge',
        subtitle: 'Energy Boosting • Preferred with Sunlight',
        color: '#eab308',
        steps: [
          // 1. Centering (3-Part Breathing) - 3 rounds
          ...Array(3).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Centering: Inhale (Belly-Ribs-Chest) ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { phase: 'hold', duration: 2, label: 'Centering: Pause', ring: 'middle' },
            { phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          // 2. Energize (2 Rounds): Active nasal inhalation/exhalation (Bhastrika)
          { phase: 'bhastrika', duration: 30, label: 'Energize: Bhastrika (Round 1/2)', ring: 'all', sound: 'bhastrika' },
          { phase: 'stillness', duration: 5, label: 'Pause & Reset', ring: 'middle' },
          { phase: 'bhastrika', duration: 30, label: 'Energize: Bhastrika (Round 2/2)', ring: 'all', sound: 'bhastrika' },
          // 3. Be with yourself
          { phase: 'stillness', duration: 30, label: 'Be with yourself', ring: 'middle' }
        ]
      },
      sports_victory: {
        id: 'sports_victory',
        title: 'Sports - Victory (Pre-Sports)',
        subtitle: 'Centering & Ocean Breath (Ujjayi)',
        color: '#22c55e',
        steps: [
          // 1. Centering (3-Part Breathing) - 3 rounds (ADDED)
          ...Array(3).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { phase: 'hold', duration: 2, label: 'Centering: Pause', ring: 'middle' },
            { phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          // 2. Ocean Breath (Ujjayi) - 4 rounds
          ...Array(4).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 5, label: `Ujjayi Ocean Inhale ${i+1}/4`, ring: 'inner', sound: 'ujjayi' },
            { phase: 'hold', duration: 2, label: 'Ujjayi Hold', ring: 'middle' },
            { phase: 'exhale', duration: 6, label: `Ujjayi Ocean Exhale ${i+1}/4`, ring: 'outer', sound: 'ujjayi' }
          ]),
          // 3. Be with yourself
          { phase: 'stillness', duration: 30, label: 'Be with yourself (Focus)', ring: 'middle' }
        ]
      },
      sports_recovery: {
        id: 'sports_recovery',
        title: 'Sports - Recovery (Post-Sports)',
        subtitle: 'Centering & Balloon Pop Straw Exhale',
        color: '#10b981',
        steps: [
          // 1. Centering (3-Part Breathing) - 3 rounds (ADDED)
          ...Array(3).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { phase: 'hold', duration: 2, label: 'Centering: Pause', ring: 'middle' },
            { phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          // 2. Balloon Pop Breathing (Straw Exhale) - 5 rounds
          ...Array(5).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `4-Count Belly Inhale ${i+1}/5`, ring: 'inner' },
            { phase: 'exhale', duration: 8, label: `8-Count Slow Straw Exhale ${i+1}/5`, ring: 'outer', sound: 'straw' }
          ]),
          // 3. Be with yourself
          { phase: 'stillness', duration: 30, label: 'Be with yourself', ring: 'middle' }
        ]
      },
      focus: {
        id: 'focus',
        title: 'Before Study / Exam / HW',
        subtitle: 'Centering & Box Breathing',
        color: '#06b6d4',
        steps: [
          // 1. Centering - 3 rounds
          ...Array(3).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          // 2. Box Breathing - 8 rounds
          ...Array(8).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Box Inhale ${i+1}/8`, ring: 'inner' },
            { phase: 'hold', duration: 4, label: `Box Hold ${i+1}/8`, ring: 'middle' },
            { phase: 'exhale', duration: 4, label: `Box Exhale ${i+1}/8`, ring: 'outer' },
            { phase: 'hold', duration: 4, label: `Box Rest ${i+1}/8`, ring: 'middle' }
          ]),
          // 3. Be with yourself
          { phase: 'stillness', duration: 30, label: 'Be with yourself (Calm Focus)', ring: 'middle' }
        ]
      },
      sleep: {
        id: 'sleep',
        title: 'Before Sleep',
        subtitle: 'Deep Sleep • Lying down or legs up wall',
        color: '#a855f7',
        steps: [
          // 1. Centering - 3 rounds
          ...Array(3).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          // 2. Balloon pop breathing - 5 rounds
          ...Array(5).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Balloon Belly Inhale ${i+1}/5`, ring: 'inner' },
            { phase: 'exhale', duration: 8, label: `8-Count Straw Exhale ${i+1}/5`, ring: 'outer', sound: 'straw' }
          ]),
          // 3. Buzzing Bee Breath (Bhramari) - 5 rounds
          ...Array(5).fill(null).flatMap((_, i) => [
            { phase: 'inhale', duration: 4, label: `Inhale Normally ${i+1}/5`, ring: 'inner' },
            { phase: 'exhale', duration: 7, label: `Buzzing Bee Hum (Bhramari) ${i+1}/5`, ring: 'outer', sound: 'bhramari' }
          ]),
          // 4. Be with yourself
          { phase: 'stillness', duration: 30, label: 'Be with yourself (Hands at side)', ring: 'middle' }
        ]
      }
    };

    function App() {
      const [appState, setAppState] = useState('idle');
      
      // Daily Target & Progress states
      const [dailyTarget, setDailyTarget] = useState(5); // User configurable: 1 to 8 sessions
      const [completedDailySessions, setCompletedDailySessions] = useState(0);
      const [weeklyDaysCompleted, setWeeklyDaysCompleted] = useState(0); // 0 to 7 rainbow days
      
      const [activeRoutineKey, setActiveRoutineKey] = useState(null);
      const [stepIndex, setStepIndex] = useState(0);
      const [currentStep, setCurrentStep] = useState(null);
      const [phaseProgress, setPhaseProgress] = useState(0);

      // BOLT test states
      const [boltPrepStep, setBoltPrepStep] = useState(0);
      const [boltStartTime, setBoltStartTime] = useState(null);
      const [boltScore, setBoltScore] = useState(0);
      const [boltCategory, setBoltCategory] = useState(null);

      const [hapticRipple, setHapticRipple] = useState(null);
      const [isPressingButton, setIsPressingButton] = useState(false);

      const audioCtxRef = useRef(null);
      const activeNodesRef = useRef([]);

      const getAudioContext = () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        if (!audioCtxRef.current) {
          audioCtxRef.current = new AudioContext();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      };

      const stopActiveSound = () => {
        activeNodesRef.current.forEach(node => {
          try { node.stop(); } catch(e){}
          try { node.disconnect(); } catch(e){}
        });
        activeNodesRef.current = [];
      };

      const playAcousticSound = (type, durationMs = 1000, soundType = 'normal') => {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const dur = durationMs / 1000;
        stopActiveSound();

        // 1. BHRAMARI (Buzzing Bee): Real-time Harmonic Humming Synthesizer
        if (soundType === 'bhramari') {
          const fundamental = 128; // ~C3 warm voice hum
          const gainNode = ctx.createGain();
          gainNode.connect(ctx.destination);

          // Build harmonic spectrum (fundamental + 2nd + 3rd + 4th harmonics for rich nasal hum)
          const harmonics = [1.0, 0.6, 0.35, 0.15];
          harmonics.forEach((amp, idx) => {
            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(fundamental * (idx + 1), now);
            
            // Soft vibrato / pitch fluctuation
            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(4.5, now); // 4.5 Hz natural vibrato
            lfoGain.gain.setValueAtTime(1.5 * (idx + 1), now);
            lfo.connect(osc.frequency);
            lfo.start(now);
            lfo.stop(now + dur);

            oscGain.gain.setValueAtTime(amp * 0.1, now);
            osc.connect(oscGain);
            oscGain.connect(gainNode);

            osc.start(now);
            osc.stop(now + dur);
            activeNodesRef.current.push(osc, lfo);
          });

          // Soft lowpass filter to remove harshness
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(380, now);
          
          gainNode.gain.setValueAtTime(0.001, now);
          gainNode.gain.linearRampToValueAtTime(0.2, now + 0.4);
          gainNode.gain.setValueAtTime(0.2, now + dur - 0.4);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + dur);

          if (navigator.vibrate) navigator.vibrate([dur * 1000]);
          return;
        }

        // 2. BHASTRIKA: Rapid Energetic Pulsing Haptics & Acoustic Bursts
        if (soundType === 'bhastrika' || type === 'bhastrika') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + dur);

          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.start(now);
          osc.stop(now + dur);
          activeNodesRef.current.push(osc);

          if (navigator.vibrate) navigator.vibrate([40, 20, 40]);
          return;
        }

        // 3. NOISE-BASED BREATHING (Normal, Ujjayi Ocean, Straw Exhale)
        const bufferSize = ctx.sampleRate * Math.max(dur, 1.5);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0.0;
        
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + (0.02 * white)) / 1.02; // Brownian noise base
          lastOut = data[i];
          data[i] *= 3.5;
        }

        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;

        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        if (soundType === 'ujjayi') {
          // Ujjayi Ocean Wave Acoustics: Glottal resonance with ocean wave pitch sweep
          filter.type = 'bandpass';
          filter.Q.setValueAtTime(1.8, now);
          
          if (type === 'inhale') {
            filter.frequency.setValueAtTime(140, now);
            filter.frequency.exponentialRampToValueAtTime(380, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.35, now + dur * 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          } else {
            filter.frequency.setValueAtTime(340, now);
            filter.frequency.exponentialRampToValueAtTime(120, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.38, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          }
        } else if (soundType === 'straw') {
          // Straw Exhale: High-Q narrow resonant whistling air current
          filter.type = 'bandpass';
          filter.Q.setValueAtTime(5.5, now); // Sharp narrow peak for straw whistle effect
          filter.frequency.setValueAtTime(620, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + dur);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.3, now + 0.2);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        } else {
          // Normal Gentle Airflow
          filter.type = 'lowpass';
          if (type === 'inhale') {
            filter.frequency.setValueAtTime(160, now);
            filter.frequency.exponentialRampToValueAtTime(320, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.25, now + dur * 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          } else {
            filter.frequency.setValueAtTime(280, now);
            filter.frequency.exponentialRampToValueAtTime(110, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.28, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          }
        }

        source.start(now);
        source.stop(now + dur);
        activeNodesRef.current.push(source);

        if (navigator.vibrate) {
          navigator.vibrate(type === 'inhale' ? [30, 200, 30] : [dur * 250]);
        }
      };

      useEffect(() => {
        let animationFrame;
        let stepStartTime = Date.now();

        if (appState === 'practicing' && activeRoutineKey) {
          const routine = ROUTINES[activeRoutineKey];
          if (!routine || stepIndex >= routine.steps.length) {
            finishRoutine(activeRoutineKey);
            return;
          }

          const step = routine.steps[stepIndex];
          setCurrentStep(step);
          const durationMs = step.duration * 1000;

          if (step.phase === 'bhastrika') {
            setHapticRipple('sharp');
            playAcousticSound('bhastrika', durationMs, 'bhastrika');
          } else if (step.phase === 'inhale') {
            setHapticRipple('sharp');
            playAcousticSound('inhale', durationMs, step.sound || 'normal');
          } else if (step.phase === 'exhale') {
            setHapticRipple('smooth');
            playAcousticSound('exhale', durationMs, step.sound || 'normal');
          } else {
            setHapticRipple(null);
            stopActiveSound();
          }

          const update = () => {
            const elapsed = Date.now() - stepStartTime;
            const progress = Math.min(elapsed / durationMs, 1.0);
            setPhaseProgress(progress);

            if (progress >= 1.0) {
              setStepIndex(prev => prev + 1);
            } else {
              animationFrame = requestAnimationFrame(update);
            }
          };

          animationFrame = requestAnimationFrame(update);
        } else {
          stopActiveSound();
          setHapticRipple(null);
        }

        return () => {
          cancelAnimationFrame(animationFrame);
          stopActiveSound();
        };
      }, [appState, activeRoutineKey, stepIndex]);

      const startRoutine = (key) => {
        getAudioContext();
        setActiveRoutineKey(key);
        setStepIndex(0);
        setPhaseProgress(0);
        setAppState('practicing');
      };

      const finishRoutine = (key) => {
        setAppState('idle');
        setCurrentStep(null);
        setStepIndex(0);
        setPhaseProgress(0);
        stopActiveSound();

        // Increment daily completed sessions count
        setCompletedDailySessions(prevCount => {
          const newCount = prevCount + 1;
          
          // Check if user reached their custom daily target
          if (newCount >= dailyTarget) {
            // Light up next day on 7-segment weekly rainbow ring!
            setWeeklyDaysCompleted(prevDays => Math.min(prevDays + 1, 7));
            // Reset daily count after completing the 24h cycle target
            return 0;
          }
          return newCount;
        });
      };

      const handleCenterTap = () => {
        getAudioContext();

        if (appState === 'idle') {
          setAppState('menu');
        } else if (appState === 'menu') {
          setAppState('idle');
        } else if (appState === 'practicing') {
          setAppState('idle');
          setCurrentStep(null);
          stopActiveSound();
        } else if (appState === 'bolt_instructions') {
          setBoltPrepStep(1);
          setAppState('bolt_prep');
        } else if (appState === 'bolt_prep') {
          if (boltPrepStep < 3) {
            setBoltPrepStep(prev => prev + 1);
          } else {
            setBoltStartTime(Date.now());
            setAppState('bolt_active');
          }
        } else if (appState === 'bolt_active') {
          const score = Math.floor((Date.now() - boltStartTime) / 1000);
          setBoltScore(score);

          if (score < 10) setBoltCategory({ color: '#ef4444', text: 'Low CO2 Tolerance (<10s)' });
          else if (score < 20) setBoltCategory({ color: '#f97316', text: 'Moderate CO2 Tolerance (10-20s)' });
          else if (score <= 40) setBoltCategory({ color: '#22c55e', text: 'Good CO2 Tolerance (20-40s)' });
          else setBoltCategory({ color: '#eab308', text: 'Optimal CO2 Tolerance (>40s)' });

          setAppState('bolt_result');
          setTimeout(() => setAppState('idle'), 6000);
        } else if (appState === 'reward') {
          setWeeklyDaysCompleted(0);
          setCompletedDailySessions(0);
          setAppState('idle');
        }
      };

      const getCenterButtonText = () => {
        switch (appState) {
          case 'idle': return 'START';
          case 'menu': return 'BACK';
          case 'practicing': return currentStep ? `${Math.ceil(currentStep.duration * (1 - phaseProgress))}s` : 'STOP';
          case 'bolt_instructions': return 'NEXT';
          case 'bolt_prep': return boltPrepStep === 3 ? 'HOLD & START' : `BREATH ${boltPrepStep}/3`;
          case 'bolt_active': return 'STOP';
          case 'bolt_result': return `${boltScore}s`;
          case 'reward': return 'CLAIM';
          default: return '';
        }
      };

      // 7 Solid Rainbow Colors for 7 Days of the Week
      const WEEKLY_RAINBOW_COLORS = [
        '#ef4444', // Red
        '#f97316', // Orange
        '#eab308', // Yellow
        '#22c55e', // Green
        '#3b82f6', // Blue
        '#a855f7', // Purple
        '#ec4899'  // Pink
      ];

      return (
        <div className="min-h-screen bg-black flex flex-col items-center justify-between py-6 px-4 select-none relative">
          
          {/* Header & Status Display */}
          <div className="text-center w-full max-w-md mt-1">
            <h1 className="text-2xl font-black tracking-widest text-orange-500 uppercase mb-0.5">
              Savitu
            </h1>
            
            {appState === 'idle' && (
              <div>
                <p className="text-[11px] font-semibold tracking-wider text-gray-400">HARDWARE BREATHING SIMULATOR</p>
                <div className="mt-2 flex items-center justify-center gap-2">
                  <span className="text-xs font-bold text-white bg-neutral-900 border border-white/10 px-3 py-1 rounded-full">
                    Day Progress: <span className="text-orange-400">{completedDailySessions}/{dailyTarget} Sessions</span>
                  </span>
                  <span className="text-xs font-bold text-white bg-neutral-900 border border-white/10 px-3 py-1 rounded-full">
                    Week: <span className="text-emerald-400">{weeklyDaysCompleted}/7 Days</span>
                  </span>
                </div>
              </div>
            )}

            {appState === 'menu' && (
              <p className="text-xs font-semibold tracking-wider text-gray-300">SELECT BREATHWORK ROUTINE</p>
            )}

            {appState === 'practicing' && activeRoutineKey && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full" style={{ backgroundColor: `${ROUTINES[activeRoutineKey].color}25`, color: ROUTINES[activeRoutineKey].color }}>
                  {ROUTINES[activeRoutineKey].title}
                </span>
                <p className="text-sm font-bold text-white mt-1.5 h-6 animate-fade-in">
                  {currentStep ? currentStep.label : 'Preparing...'}
                </p>
              </div>
            )}

            {appState === 'bolt_instructions' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-orange-500/20 text-orange-400">
                  BOLT Score Assessment
                </span>
                <p className="text-xs text-gray-300 mt-1">CO2 Tolerance Test Instructions</p>
              </div>
            )}

            {appState === 'bolt_prep' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-orange-500/20 text-orange-400">
                  Preparation Phase
                </span>
                <p className="text-sm font-bold text-orange-300 mt-1">
                  {boltPrepStep < 3 ? `Deep Breath #${boltPrepStep} (Inhale & Exhale)` : 'At end of 3rd exhale, hold breath & tap button!'}
                </p>
              </div>
            )}

            {appState === 'bolt_active' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-red-500/20 text-red-400">
                  Holding Breath
                </span>
                <p className="text-xs text-gray-300 mt-1">Tap STOP at first definite urge to breathe</p>
              </div>
            )}

            {appState === 'bolt_result' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">
                  BOLT Score Result
                </span>
                <p className="text-sm font-bold text-white mt-1">{boltCategory?.text}</p>
              </div>
            )}
          </div>

          {}
          <div className="relative flex items-center justify-center my-auto w-80 h-80">
            
            <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full rotate-[-90deg]">
              
              {/* 1. OUTER RAINBOW RING (Weekly Progress: 7 Segments - Red, Orange, Yellow, Green, Blue, Purple, Pink) */}
              {Array.from({ length: 7 }).map((_, i) => {
                const startAngle = i * (360 / 7) + 2;
                const endAngle = (i + 1) * (360 / 7) - 2;
                const isActive = i < weeklyDaysCompleted || appState === 'reward';
                
                return (
                  <path
                    key={`weekly-rainbow-${i}`}
                    d={describeArc(100, 100, 93, startAngle, endAngle)}
                    fill="none"
                    stroke={isActive ? WEEKLY_RAINBOW_COLORS[i] : '#262626'}
                    strokeWidth="5"
                    strokeLinecap="round"
                    className="transition-all duration-500"
                  />
                );
              })}

              {/* 2. WHITE LIGHT RING (Daily Sessions Target Breakdown - Right Underneath Rainbow Ring) */}
              {Array.from({ length: dailyTarget }).map((_, i) => {
                const gap = dailyTarget > 1 ? 3 : 0;
                const startAngle = i * (360 / dailyTarget) + gap;
                const endAngle = (i + 1) * (360 / dailyTarget) - gap;
                const isSectionActive = i < completedDailySessions;

                return (
                  <path
                    key={`daily-white-${i}`}
                    d={describeArc(100, 100, 83, startAngle, endAngle)}
                    fill="none"
                    stroke="#ffffff"
                    strokeWidth="4"
                    strokeLinecap="round"
                    style={{
                      opacity: isSectionActive ? 1 : 0.15,
                      filter: isSectionActive ? 'drop-shadow(0 0 4px #ffffff)' : 'none',
                      transition: 'opacity 0.4s ease'
                    }}
                  />
                );
              })}

              {/* 3. INNER PRACTICE RINGS: Outer (Exhale), Middle (Hold/Stillness), Inner (Inhale) */}
              {/* Outer Practice Ring (r=68) */}
              <circle
                cx="100" cy="100" r="68"
                fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round"
                style={{
                  strokeDasharray: `${2 * Math.PI * 68}`,
                  strokeDashoffset: (appState === 'practicing' && currentStep?.ring === 'outer') 
                    ? (2 * Math.PI * 68 * (1 - phaseProgress)) 
                    : 2 * Math.PI * 68,
                  opacity: (appState === 'practicing' && currentStep?.ring === 'outer') ? 1 : 0.08,
                  transition: 'stroke-dashoffset 0.1s linear'
                }}
              />
              <circle cx="100" cy="100" r="68" fill="none" stroke="#ffffff" strokeWidth="6" className="opacity-[0.04]" />

              {/* Middle Practice Ring (r=52) */}
              <circle
                cx="100" cy="100" r="52"
                fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round"
                style={{
                  strokeDasharray: `${2 * Math.PI * 52}`,
                  strokeDashoffset: (appState === 'practicing' && currentStep?.ring === 'middle') 
                    ? (2 * Math.PI * 52 * (1 - phaseProgress)) 
                    : 2 * Math.PI * 52,
                  opacity: (appState === 'practicing' && currentStep?.ring === 'middle') ? 1 : 0.08,
                  transition: 'stroke-dashoffset 0.1s linear'
                }}
              />
              <circle cx="100" cy="100" r="52" fill="none" stroke="#ffffff" strokeWidth="6" className="opacity-[0.04]" />

              {/* Inner Practice Ring (r=36) */}
              <circle
                cx="100" cy="100" r="36"
                fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round"
                style={{
                  strokeDasharray: `${2 * Math.PI * 36}`,
                  strokeDashoffset: (appState === 'practicing' && (currentStep?.ring === 'inner' || currentStep?.ring === 'all')) 
                    ? (2 * Math.PI * 36 * (1 - phaseProgress)) 
                    : 2 * Math.PI * 36,
                  opacity: (appState === 'practicing' && (currentStep?.ring === 'inner' || currentStep?.ring === 'all')) ? 1 : 0.08,
                  transition: 'stroke-dashoffset 0.1s linear'
                }}
              />
              <circle cx="100" cy="100" r="36" fill="none" stroke="#ffffff" strokeWidth="6" className="opacity-[0.04]" />
            </svg>

            {/* Center Orange Haptic Button */}
            <button
              onClick={handleCenterTap}
              onTouchStart={() => setIsPressingButton(true)}
              onTouchEnd={() => setIsPressingButton(false)}
              onMouseDown={() => setIsPressingButton(true)}
              onMouseUp={() => setIsPressingButton(false)}
              className={`
                relative z-10 w-24 h-24 rounded-full bg-orange-500 text-black font-extrabold text-xs tracking-wider
                border-4 border-black select-none outline-none transition-transform duration-100 active:scale-95
                flex items-center justify-center text-center p-2 shadow-[0_0_30px_rgba(249,115,22,0.4)]
              `}
              style={{
                boxShadow: isPressingButton 
                  ? '0 0 50px #f97316, inset 0 0 15px rgba(0,0,0,0.4)' 
                  : hapticRipple === 'sharp' 
                    ? '0 0 40px #f97316' 
                    : hapticRipple === 'smooth' 
                      ? '0 0 25px rgba(249,115,22,0.8)' 
                      : '0 0 30px rgba(249,115,22,0.3)'
              }}
            >
              {hapticRipple === 'sharp' && (
                <span className="absolute inset-0 rounded-full border-4 border-orange-300 animate-ping opacity-75" />
              )}
              {hapticRipple === 'smooth' && (
                <span className="absolute inset-[-12px] rounded-full border border-orange-500/40 animate-pulse" />
              )}
              <span className="relative z-10 uppercase leading-tight font-black">{getCenterButtonText()}</span>
            </button>

            {}
            {appState === 'menu' && (
              <div className="absolute inset-0 z-30 flex flex-col items-center justify-between p-3.5 bg-black/95 backdrop-blur-lg rounded-3xl border border-white/10 shadow-2xl animate-fade-in overflow-y-auto">
                <p className="text-xs font-extrabold text-orange-400 tracking-widest uppercase mb-1">Routines</p>
                
                <div className="w-full space-y-1.5 my-auto">
                  {Object.values(ROUTINES).map((rt) => (
                    <button
                      key={rt.id}
                      onClick={() => startRoutine(rt.id)}
                      className="w-full text-left p-2 rounded-xl border border-white/10 bg-neutral-900/80 hover:bg-neutral-800 transition-all flex items-center justify-between group"
                    >
                      <div>
                        <div className="text-xs font-bold text-white group-hover:text-orange-400 transition-colors">{rt.title}</div>
                        <div className="text-[10px] text-gray-400">{rt.subtitle}</div>
                      </div>
                      <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: rt.color }} />
                    </button>
                  ))}

                  {/* BOLT Test Option */}
                  <button
                    onClick={() => setAppState('bolt_instructions')}
                    className="w-full text-left p-2 rounded-xl border border-orange-500/30 bg-orange-950/20 hover:bg-orange-900/30 transition-all flex items-center justify-between"
                  >
                    <div>
                      <div className="text-xs font-bold text-orange-300">BOLT Score Test</div>
                      <div className="text-[10px] text-orange-400/80">Measure CO2 Tolerance</div>
                    </div>
                    <span className="text-xs text-orange-400 font-bold">→</span>
                  </button>

                  {/* Daily Target Goal Configurator */}
                  <div className="p-2 rounded-xl border border-white/10 bg-neutral-900/60 flex items-center justify-between">
                    <span className="text-[11px] font-medium text-gray-300">Daily Goal Sessions:</span>
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setDailyTarget(t => Math.max(1, t - 1))}
                        className="w-5 h-5 rounded bg-neutral-800 text-white text-xs font-bold flex items-center justify-center hover:bg-neutral-700"
                      >-</button>
                      <span className="text-xs font-bold text-orange-400 w-3 text-center">{dailyTarget}</span>
                      <button 
                        onClick={() => setDailyTarget(t => Math.min(8, t + 1))}
                        className="w-5 h-5 rounded bg-neutral-800 text-white text-xs font-bold flex items-center justify-center hover:bg-neutral-700"
                      >+</button>
                    </div>
                  </div>
                </div>

                <button
                  onClick={handleCenterTap}
                  className="mt-1 text-[10px] font-bold text-gray-400 uppercase tracking-widest hover:text-white"
                >
                  Close Menu
                </button>
              </div>
            )}

            {/* BOLT Test Instructions Modal */}
            {appState === 'bolt_instructions' && (
              <div className="absolute inset-0 z-30 flex flex-col items-center justify-between p-4 bg-neutral-950/95 backdrop-blur-lg rounded-3xl border border-orange-500/30 shadow-2xl animate-fade-in text-center">
                <div className="w-full">
                  <h3 className="text-sm font-extrabold text-orange-400 uppercase tracking-wider mb-2">BOLT Score Instructions</h3>
                  <div className="text-left text-xs text-gray-300 space-y-1.5 bg-neutral-900 p-2.5 rounded-xl border border-white/5">
                    <p className="flex items-start gap-1.5">
                      <span className="font-bold text-orange-400">1.</span>
                      <span>Take <strong>3 deep breaths</strong> through your nose.</span>
                    </p>
                    <p className="flex items-start gap-1.5">
                      <span className="font-bold text-orange-400">2.</span>
                      <span>At the end of the <strong>3rd last exhale</strong>, hold your breath and press the center button.</span>
                    </p>
                    <p className="flex items-start gap-1.5">
                      <span className="font-bold text-orange-400">3.</span>
                      <span>Press the button again to <strong>stop</strong> at first definite urge to breathe.</span>
                    </p>
                  </div>
                </div>

                <div className="flex gap-2 w-full mt-2">
                  <button
                    onClick={() => setAppState('menu')}
                    className="w-1/2 py-1.5 rounded-xl text-xs font-bold bg-neutral-800 text-gray-300 hover:bg-neutral-700"
                  >
                    Back
                  </button>
                  <button
                    onClick={handleCenterTap}
                    className="w-1/2 py-1.5 rounded-xl text-xs font-bold bg-orange-500 text-black hover:bg-orange-400"
                  >
                    Start Prep
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Footer Guidance Note */}
          <div className="w-full max-w-sm text-center mb-1">
            {appState === 'idle' && (
              <p className="text-[11px] text-gray-500">
                Tap center button to open menu. Adjust daily target sessions in settings menu.
              </p>
            )}

            {appState === 'practicing' && currentStep?.technique === 'vibhagiya' && (
              <div className="text-xs text-orange-300/90 bg-orange-950/20 py-1.5 px-3 rounded-lg border border-orange-500/20">
                💡 <strong>Centering (Vibhagiya):</strong> Fill belly first, then ribcage, then upper chest.
              </div>
            )}

            {appState === 'practicing' && activeRoutineKey === 'sleep' && (
              <div className="text-xs text-purple-300/90 bg-purple-950/20 py-1.5 px-3 rounded-lg border border-purple-500/20">
                🌙 <strong>Posture Tip:</strong> Recommended lying down or with legs up the wall.
              </div>
            )}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
