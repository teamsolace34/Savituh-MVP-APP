  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const YOUTUBE_PLAYLIST_ID = 'PLJpJu_L04dbM';
    const YOUTUBE_PLAYLIST_URL = `https://www.youtube.com/playlist?list=${YOUTUBE_PLAYLIST_ID}`;
    const YOUTUBE_EMBED_URL = `https://www.youtube-nocookie.com/embed/videoseries?list=${YOUTUBE_PLAYLIST_ID}`;

    const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
      const angleInRadians = (angleInDegrees - 90) * (Math.PI / 180.0);
      return {
        x: centerX + radius * Math.cos(angleInRadians),
        y: centerY + radius * Math.sin(angleInRadians)
      };
    };

    const describeArc = (x, y, radius, startAngle, endAngle) => {
      const start = polarToCartesian(x, y, radius, endAngle);
      const end = polarToCartesian(x, y, radius, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return [
        "M", start.x, start.y,
        "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y
      ].join(" ");
    };

    const ROUTINES = {
      recharge: {

            { stage: 'centering', phase: 'hold', duration: 2, label: 'Centering: Pause', ring: 'middle' },
            { stage: 'centering', phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          { stage: 'practice', phase: 'bhastrika', duration: 30, label: 'Energize: Bhastrika (Round 1/2) - Hands Up & Down', ring: 'all', sound: 'bhastrika', showHands: true, voice: "Pump it up! Arms high on the inhale, drive them down on the exhale!" },
          { stage: 'centering', phase: 'stillness', duration: 5, label: 'Pause & Reset', ring: 'middle' },
          { stage: 'practice', phase: 'bhastrika', duration: 30, label: 'Energize: Bhastrika (Round 2/2) - Hands Up & Down', ring: 'all', sound: 'bhastrika', showHands: true, voice: "Last round, let's crush it! Keep that energy surging!" },
          { stage: 'stillness', phase: 'stillness', duration: 30, label: 'Be with yourself (Silent Stillness)', ring: 'middle', voice: "Let's chill and be with ourselves for a bit. Enjoy this calm vibe." }
        ]
      },
      sports_victory: {
        id: 'sports_victory',
        title: 'Sports - Victory (Pre-Sports)',
        subtitle: 'Centering & Ocean Breath (Ujjayi)',
        color: '#38b000',
        introVoice: "Game face on! Let's lock in and get that pre-game focus dialed.",
        steps: [
          ...Array(3).fill(null).flatMap((_, i) => [
            { stage: 'centering', phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { stage: 'centering', phase: 'hold', duration: 2, label: 'Centering: Pause', ring: 'middle' },
            { stage: 'centering', phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          ...Array(4).fill(null).flatMap((_, i) => [
            { stage: 'practice', phase: 'inhale', duration: 5, label: `Ujjayi Ocean Inhale ${i+1}/4`, ring: 'inner', sound: 'ujjayi' },
            { stage: 'practice', phase: 'hold', duration: 2, label: 'Ujjayi Hold', ring: 'middle' },
            { stage: 'practice', phase: 'exhale', duration: 6, label: `Ujjayi Ocean Exhale ${i+1}/4`, ring: 'outer', sound: 'ujjayi', voice: i === 0 ? "Channel that inner ocean wave. Smooth and powerful." : null }
          ]),
          { stage: 'stillness', phase: 'stillness', duration: 30, label: 'Be with yourself (Silent Stillness)', ring: 'middle', voice: "Let's take a moment to hang out with ourselves and feel completely unstoppable." }
        ]
      },
      sports_recovery: {
        id: 'sports_recovery',
        title: 'Sports - Recovery (Post-Sports)',
        subtitle: 'Centering & Balloon Pop Straw Exhale',
        color: '#118ab2',
        introVoice: "Great hustle out there! Time to cool down, reset, and catch your breath.",
        steps: [
          ...Array(3).fill(null).flatMap((_, i) => [
            { stage: 'centering', phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { stage: 'centering', phase: 'centering', phase: 'hold', duration: 2, label: 'Centering: Pause', ring: 'middle' },
            { stage: 'centering', phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          ...Array(5).fill(null).flatMap((_, i) => [
            { stage: 'practice', phase: 'inhale', duration: 4, label: `4-Count Belly Inhale ${i+1}/5`, ring: 'inner' },
            { stage: 'practice', phase: 'exhale', duration: 8, label: `8-Count Slow Straw Exhale ${i+1}/5`, ring: 'outer', sound: 'straw', voice: i === 0 ? "Pretend you're blowing through a straw. Long and steady!" : null }
          ]),
          { stage: 'stillness', phase: 'stillness', duration: 30, label: 'Be with yourself (Silent Stillness)', ring: 'middle', voice: "Let's kick back, hang out with ourselves, and let that recovery sink in." }
        ]
      },
      focus: {
        id: 'focus',
        title: 'Before Study / Exam / HW',
        subtitle: 'Centering & Box Breathing',
        color: '#118ab2',
        introVoice: "Big test or study grind ahead? Let's clear the static and lock in absolute focus.",
        steps: [
          ...Array(3).fill(null).flatMap((_, i) => [
            { stage: 'centering', phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { stage: 'centering', phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          ...Array(6).fill(null).flatMap((_, i) => [
            { stage: 'practice', phase: 'inhale', duration: 4, label: `Box Inhale ${i+1}/6`, ring: 'inner' },
            { stage: 'practice', phase: 'hold', duration: 4, label: `Box Hold ${i+1}/6`, ring: 'middle' },
            { stage: 'practice', phase: 'exhale', duration: 4, label: `Box Exhale ${i+1}/6`, ring: 'outer' },
            { stage: 'practice', phase: 'hold', duration: 4, label: `Box Rest ${i+1}/6`, ring: 'middle' }
          ]),
          { stage: 'stillness', phase: 'stillness', duration: 30, label: 'Be with yourself (Silent Stillness)', ring: 'middle', voice: "Let's pause and spend quality time with ourselves. You've totally got this study session!" }
        ]
      },
      sleep: {
        id: 'sleep',
        title: 'Before Sleep',
        subtitle: 'Deep Sleep • Lying down or legs up wall',
        color: '#7209b7',
        introVoice: "Time to power down for the night. Get cozy, get comfortable, and let's unwind.",
        steps: [
          ...Array(3).fill(null).flatMap((_, i) => [
            { stage: 'centering', phase: 'inhale', duration: 4, label: `Centering: Inhale ${i+1}/3`, ring: 'inner', technique: 'vibhagiya' },
            { stage: 'centering', phase: 'exhale', duration: 4, label: `Centering: Exhale ${i+1}/3`, ring: 'outer' }
          ]),
          ...Array(5).fill(null).flatMap((_, i) => [
            { stage: 'practice', phase: 'inhale', duration: 4, label: `Balloon Belly Inhale ${i+1}/5`, ring: 'inner' },
            { stage: 'practice', phase: 'exhale', duration: 8, label: `8-Count Straw Exhale ${i+1}/5`, ring: 'outer', sound: 'straw' }
          ]),
          ...Array(5).fill(null).flatMap((_, i) => [
            { stage: 'practice', phase: 'inhale', duration: 4, label: `Inhale Normally ${i+1}/5`, ring: 'inner' },
            { stage: 'practice', phase: 'exhale', duration: 7, label: `Buzzing Bee Hum (Bhramari) ${i+1}/5`, ring: 'outer', sound: 'bhramari', voice: i === 0 ? "Time for the buzzing bee breath. Let's make that cozy sound!" : null }
          ]),
          { stage: 'stillness', phase: 'stillness', duration: 30, label: 'Be with yourself (Silent Stillness)', ring: 'middle', voice: "Let's drift away and spend a quiet moment with ourselves. Sweet dreams!" }
        ]
      }
    };

    const speakPrompt = (text) => {
      try {
        if ('speechSynthesis' in window && text) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.05; // Slightly upbeat and energetic
          utterance.pitch = 1.15; // Brighter, friendlier teen voice tone
          utterance.volume = 1.0;
          
          // Try to pick a bright English voice if available
          const voices = window.speechSynthesis.getVoices();
          const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Karen') || v.name.includes('Daniel')));
          if (preferredVoice) {
            utterance.voice = preferredVoice;
          }

          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.error('Speech synthesis error:', e);
      }
    };

    function App() {
      const savedSessions = parseInt(localStorage.getItem('savitu_daily_sessions') || '0', 10);
      const savedDays = parseInt(localStorage.getItem('savitu_weekly_days') || '0', 10);
      const savedTarget = parseInt(localStorage.getItem('savitu_daily_target') || '5', 10);

      const [appState, setAppState] = useState('idle');
      
      const [dailyTarget, setDailyTarget] = useState(savedTarget);
      const [completedDailySessions, setCompletedDailySessions] = useState(savedSessions);
      const [weeklyDaysCompleted, setWeeklyDaysCompleted] = useState(savedDays);
      
      const [activeRoutineKey, setActiveRoutineKey] = useState(null);
      const [stepIndex, setStepIndex] = useState(0);
      const [currentStep, setCurrentStep] = useState(null);
      const [phaseProgress, setPhaseProgress] = useState(0);

      const [boltPrepStep, setBoltPrepStep] = useState(0);
      const [boltStartTime, setBoltStartTime] = useState(null);
      const [boltScore, setBoltScore] = useState(0);
      const [boltCategory, setBoltCategory] = useState(null);

      const [hapticRipple, setHapticRipple] = useState(null);
      const [isPressingButton, setIsPressingButton] = useState(false);
      const [bhastrikaSubPhase, setBhastrikaSubPhase] = useState('up'); // 'up' or 'down'

      const audioCtxRef = useRef(null);
      const activeNodesRef = useRef([]);
      const lastAnnouncedStageRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('savitu_daily_sessions', completedDailySessions.toString());
        localStorage.setItem('savitu_weekly_days', weeklyDaysCompleted.toString());
        localStorage.setItem('savitu_daily_target', dailyTarget.toString());
      }, [completedDailySessions, weeklyDaysCompleted, dailyTarget]);

      const getAudioContext = () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        if (!audioCtxRef.current) {
          audioCtxRef.current = new AudioContext();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      };

      const stopActiveSound = () => {
        activeNodesRef.current.forEach(node => {
          try { node.stop(); } catch(e){}
          try { node.disconnect(); } catch(e){}
        });
        activeNodesRef.current = [];
      };

      const playAcousticSound = (type, durationMs = 1000, soundType = 'normal') => {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const dur = durationMs / 1000;
        stopActiveSound();

        if (soundType === 'bhramari') {
          const fundamental = 128;
          const gainNode = ctx.createGain();
          gainNode.connect(ctx.destination);

          const harmonics = [1.0, 0.6, 0.35, 0.15];
          harmonics.forEach((amp, idx) => {
            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(fundamental * (idx + 1), now);
            
            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(4.5, now);
            lfoGain.gain.setValueAtTime(1.5 * (idx + 1), now);
            lfo.connect(osc.frequency);
            lfo.start(now);
            lfo.stop(now + dur);

            oscGain.gain.setValueAtTime(amp * 0.1, now);
            osc.connect(oscGain);
            oscGain.connect(gainNode);

            osc.start(now);
            osc.stop(now + dur);
            activeNodesRef.current.push(osc, lfo);
          });

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(380, now);
          
          gainNode.gain.setValueAtTime(0.001, now);
          gainNode.gain.linearRampToValueAtTime(0.2, now + 0.4);
          gainNode.gain.setValueAtTime(0.2, now + dur - 0.4);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + dur);

          if (navigator.vibrate) navigator.vibrate([dur * 1000]);
          return;
        }

        if (soundType === 'bhastrika' || type === 'bhastrika') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + dur);

          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.start(now);
          osc.stop(now + dur);
          activeNodesRef.current.push(osc);

          if (navigator.vibrate) navigator.vibrate([40, 20, 40]);
          return;
        }

        const bufferSize = ctx.sampleRate * Math.max(dur, 1.5);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0.0;
        
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        }

        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;

        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        if (soundType === 'ujjayi') {
          filter.type = 'bandpass';
          filter.Q.setValueAtTime(1.8, now);
          
          if (type === 'inhale') {
            filter.frequency.setValueAtTime(140, now);
            filter.frequency.exponentialRampToValueAtTime(380, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.35, now + dur * 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          } else {
            filter.frequency.setValueAtTime(340, now);
            filter.frequency.exponentialRampToValueAtTime(120, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.38, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          }
        } else if (soundType === 'straw') {
          filter.type = 'bandpass';
          filter.Q.setValueAtTime(5.5, now);
          filter.frequency.setValueAtTime(620, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + dur);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.3, now + 0.2);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        } else {
          filter.type = 'lowpass';
          if (type === 'inhale') {
            filter.frequency.setValueAtTime(160, now);
            filter.frequency.exponentialRampToValueAtTime(320, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.25, now + dur * 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          } else {
            filter.frequency.setValueAtTime(280, now);
            filter.frequency.exponentialRampToValueAtTime(110, now + dur);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.28, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          }
        }

        source.start(now);
        source.stop(now + dur);
        activeNodesRef.current.push(source);

        if (navigator.vibrate) {
          navigator.vibrate(type === 'inhale' ? [30, 200, 30] : [dur * 250]);
        }
      };

      useEffect(() => {
        let animationFrame;
        let stepStartTime = Date.now();

        if (appState === 'practicing' && activeRoutineKey) {
          const routine = ROUTINES[activeRoutineKey];
          if (!routine || stepIndex >= routine.steps.length) {
            finishRoutine(activeRoutineKey);
            return;
          }

          const step = routine.steps[stepIndex];
          setCurrentStep(step);
          const durationMs = step.duration * 1000;

          if (step.stage !== lastAnnouncedStageRef.current) {
            lastAnnouncedStageRef.current = step.stage;
            if (step.stage === 'centering') {
              speakPrompt("Let's center ourselves and get ready.");
            } else if (step.stage === 'practice') {
              speakPrompt(routine.introVoice);
            } else if (step.stage === 'stillness') {
              speakPrompt(step.voice || "Let's be with ourselves and spend time with our self.");
            }
          }

          if (step.voice && step.stage !== 'stillness') {
            speakPrompt(step.voice);
          }

          if (step.phase === 'bhastrika') {
            setHapticRipple('sharp');
            playAcousticSound('bhastrika', durationMs, 'bhastrika');
            if (stepIndex % 2 === 0) {
              setBhastrikaSubPhase('up');
            } else {
              setBhastrikaSubPhase('down');
            }
          } else if (step.phase === 'inhale') {
            setHapticRipple('sharp');
            playAcousticSound('inhale', durationMs, step.sound || 'normal');
          } else if (step.phase === 'exhale') {
            setHapticRipple('smooth');
            playAcousticSound('exhale', durationMs, step.sound || 'normal');
          } else {
            setHapticRipple(null);
            stopActiveSound();
          }

          const update = () => {
            const elapsed = Date.now() - stepStartTime;
            const progress = Math.min(elapsed / durationMs, 1.0);
            setPhaseProgress(progress);

            if (step.phase === 'bhastrika') {
              const cycleSecond = Math.floor(elapsed / 1000) % 2;
              setBhastrikaSubPhase(cycleSecond === 0 ? 'up' : 'down');
            }

            if (progress >= 1.0) {
              setStepIndex(prev => prev + 1);
            } else {
              animationFrame = requestAnimationFrame(update);
            }
          };

          animationFrame = requestAnimationFrame(update);
        } else {
          stopActiveSound();
          setHapticRipple(null);
          lastAnnouncedStageRef.current = null;
        }

        return () => {
          cancelAnimationFrame(animationFrame);
          stopActiveSound();
        };
      }, [appState, activeRoutineKey, stepIndex]);

      const startRoutine = (key) => {
        getAudioContext();
        setActiveRoutineKey(key);
        setStepIndex(0);
        setPhaseProgress(0);
        lastAnnouncedStageRef.current = null;
        setAppState('practicing');
      };

      const finishRoutine = (key) => {
        setAppState('idle');
        setCurrentStep(null);
        setStepIndex(0);
        setPhaseProgress(0);
        stopActiveSound();

        speakPrompt("Awesome job! You totally crushed that session!");

        setCompletedDailySessions(prevCount => {
          const newCount = prevCount + 1;
          if (newCount >= dailyTarget) {
            setWeeklyDaysCompleted(prevDays => {
              const updatedDays = Math.min(prevDays + 1, 7);
              if (updatedDays >= 7) {
                setAppState('reward');
                speakPrompt("Legendary! You completed all 7 days and unlocked full rainbow power!");
              }
              return updatedDays;
            });
            return 0;
          }
          return newCount;
        });
      };

      const handleCenterTap = () => {
        getAudioContext();

        if (appState === 'idle') {
          setAppState('menu');
        } else if (appState === 'menu') {
          setAppState('idle');
        } else if (appState === 'playlist') {
          setAppState('menu');
        } else if (appState === 'practicing') {
          setAppState('idle');
          setCurrentStep(null);
          stopActiveSound();
        } else if (appState === 'bolt_instructions') {
          setBoltPrepStep(1);
          setAppState('bolt_prep');
          speakPrompt("Take a deep breath in and out.");
        } else if (appState === 'bolt_prep') {
          if (boltPrepStep < 3) {
            setBoltPrepStep(prev => prev + 1);
            speakPrompt(`Breath number ${boltPrepStep + 1}`);
          } else {
            setBoltStartTime(Date.now());
            setAppState('bolt_active');
            speakPrompt("Hold your breath now!");
          }
        } else if (appState === 'bolt_active') {
          const score = Math.floor((Date.now() - boltStartTime) / 1000);
          setBoltScore(score);

          if (score < 10) setBoltCategory({ color: '#cc0000', text: 'Low CO2 Tolerance (<10s)' });
          else if (score < 20) setBoltCategory({ color: '#ffa62b', text: 'Moderate CO2 Tolerance (10-20s)' });
          else if (score <= 40) setBoltCategory({ color: '#38b000', text: 'Good CO2 Tolerance (20-40s)' });
          else setBoltCategory({ color: '#ffdd57', text: 'Optimal CO2 Tolerance (>40s)' });

          setAppState('bolt_result');
          speakPrompt(`Your BOLT score is ${score} seconds. Nice work checking in!`);
          setTimeout(() => setAppState('idle'), 6000);
        } else if (appState === 'reward') {
          setWeeklyDaysCompleted(0);
          setCompletedDailySessions(0);
          setAppState('idle');
        }
      };

      const resetProgressData = () => {
        setCompletedDailySessions(0);
        setWeeklyDaysCompleted(0);
        localStorage.removeItem('savitu_daily_sessions');
        localStorage.removeItem('savitu_weekly_days');
        speakPrompt("Progress reset successfully.");
      };

      const getCenterButtonText = () => {
        switch (appState) {
          case 'idle': return 'START';
          case 'menu': return 'BACK';
          case 'playlist': return 'BACK';
          case 'practicing': return currentStep ? `${Math.ceil(currentStep.duration * (1 - phaseProgress))}s` : 'STOP';
          case 'bolt_instructions': return 'NEXT';
          case 'bolt_prep': return boltPrepStep === 3 ? 'HOLD & START' : `BREATH ${boltPrepStep}/3`;
          case 'bolt_active': return 'STOP';
          case 'bolt_result': return `${boltScore}s`;
          case 'reward': return 'RESTART';
          default: return '';
        }
      };

      const WEEKLY_RAINBOW_COLORS = [
        '#cc0000', '#ffa62b', '#ffdd57', '#38b000', '#118ab2', '#7209b7', '#ff007f'
      ];

      return (
        <div className="min-h-screen bg-[#12141c] flex flex-col items-center justify-between py-6 px-4 select-none relative">
          
          <div className="text-center w-full max-w-md mt-1 z-10">
            <h1 className={`text-2xl font-black tracking-widest uppercase mb-0.5 transition-colors duration-500 ${weeklyDaysCompleted >= 7 ? 'text-transparent bg-clip-text bg-gradient-to-r from-[#cc0000] via-[#ffdd57] to-[#ff007f] animate-pulse' : 'text-[#ffa62b]'}`}>
              Savitu
            </h1>
            
            {appState === 'idle' && (
              <div>
                <p className="text-[11px] font-semibold tracking-wider text-[#d1d5db]/70">HARDWARE BREATHING SIMULATOR</p>
                <div className="mt-2 flex items-center justify-center gap-2">
                  <span className="text-xs font-bold text-white bg-[#1e2230] border border-white/10 px-3 py-1 rounded-full">
                    Day Progress: <span className="text-[#ffa62b]">{completedDailySessions}/{dailyTarget} Sessions</span>
                  </span>
                  <span className="text-xs font-bold text-white bg-[#1e2230] border border-white/10 px-3 py-1 rounded-full">
                    Week: <span className="text-[#38b000]">{weeklyDaysCompleted}/7 Days</span>
                  </span>
                </div>
              </div>
            )}

            {appState === 'menu' && (
              <p className="text-xs font-semibold tracking-wider text-[#d1d5db]">SELECT BREATHWORK ROUTINE</p>
            )}

            {appState === 'playlist' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#cc0000]/25 text-[#cc0000]">
                  YouTube Video Guides
                </span>
                <p className="text-xs text-[#d1d5db]/80 mt-1">Follow along with video instructions</p>
              </div>
            )}

            {appState === 'practicing' && activeRoutineKey && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full" style={{ backgroundColor: `${ROUTINES[activeRoutineKey].color}25`, color: ROUTINES[activeRoutineKey].color }}>
                  {ROUTINES[activeRoutineKey].title}
                </span>
                <p className="text-sm font-bold text-white mt-1.5 h-6 animate-fade-in">
                  {currentStep ? currentStep.label : 'Preparing...'}
                </p>
              </div>
            )}

            {appState === 'reward' && (
              <div className="animate-bounce">
                <span className="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-gradient-to-r from-[#cc0000] via-[#ffdd57] to-[#ff007f] text-[#12141c]">
                  🌈 FULL RAINBOW UNLOCKED!
                </span>
                <p className="text-xs font-bold text-[#ffdd57] mt-2">7 Days Completed! All Light Rings Active</p>
              </div>
            )}

            {appState === 'bolt_instructions' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#ffa62b]/25 text-[#ffa62b]">
                  BOLT Score Assessment
                </span>
                <p className="text-xs text-[#d1d5db]/80 mt-1">CO2 Tolerance Test Instructions</p>
              </div>
            )}

            {appState === 'bolt_prep' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#ffa62b]/25 text-[#ffa62b]">
                  Preparation Phase
                </span>
                <p className="text-sm font-bold text-[#ffa62b] mt-1">
                  {boltPrepStep < 3 ? `Deep Breath #${boltPrepStep} (Inhale & Exhale)` : 'At end of 3rd exhale, hold breath & tap button!'}
                </p>
              </div>
            )}

            {appState === 'bolt_active' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#cc0000]/25 text-[#cc0000]">
                  Holding Breath
                </span>
                <p className="text-xs text-[#d1d5db]/80 mt-1">Tap STOP at first definite urge to breathe</p>
              </div>
            )}

            {appState === 'bolt_result' && (
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#38b000]/25 text-[#38b000]">
                  BOLT Score Result
                </span>
                <p className="text-sm font-bold text-white mt-1">{boltCategory?.text}</p>
              </div>
            )}
          </div>

          <div className="relative flex items-center justify-center my-auto w-80 h-80">
            
            <svg viewBox="0 0 200 200" className={`absolute inset-0 w-full h-full rotate-[-90deg] ${weeklyDaysCompleted >= 7 || appState === 'reward' ? 'animate-rainbow-glow' : ''}`}>
              
              {/* 7-Segment Weekly Rainbow Progress Ring */}
              {Array.from({ length: 7 }).map((_, i) => {
                const startAngle = i * (360 / 7) + 2;
                const endAngle = (i + 1) * (360 / 7) - 2;
                const isActive = i < weeklyDaysCompleted || appState === 'reward';
                
                return (
                  <path
                    key={`weekly-rainbow-${i}`}
                    d={describeArc(100, 100, 93, startAngle, endAngle)}
                    fill="none"
                    stroke={isActive ? WEEKLY_RAINBOW_COLORS[i] : '#1e2230'}
                    strokeWidth={isActive ? "7" : "5"}
                    strokeLinecap="round"
                    className="transition-all duration-500"
                    style={{
                      filter: isActive ? `drop-shadow(0 0 6px ${WEEKLY_RAINBOW_COLORS[i]})` : 'none'
                    }}
                  />
                );
              })}

              {/* Daily White Progress Ring Segments */}
              {Array.from({ length: dailyTarget }).map((_, i) => {
                const gap = dailyTarget > 1 ? 3 : 0;
                const startAngle = i * (360 / dailyTarget) + gap;
                const endAngle = (i + 1) * (360 / dailyTarget) - gap;
                const isSectionActive = i < completedDailySessions;

                return (
                  <path
                    key={`daily-white-${i}`}
                    d={describeArc(100, 100, 83, startAngle, endAngle)}
                    fill="none"
                    stroke="#ffffff"
                    strokeWidth="4"
                    strokeLinecap="round"
                    style={{
                      opacity: isSectionActive ? 1 : 0.15,
                      filter: isSectionActive ? 'drop-shadow(0 0 5px #ffffff)' : 'none',
                      transition: 'opacity 0.4s ease'
                    }}
                  />
                );
              })}

              {/* Outer Ring */}
              <circle
                cx="100" cy="100" r="68"
                fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round"
                style={{
                  strokeDasharray: `${2 * Math.PI * 68}`,
                  strokeDashoffset: (appState === 'practicing' && currentStep?.ring === 'outer') 
                    ? (2 * Math.PI * 68 * (1 - phaseProgress)) 
                    : 2 * Math.PI * 68,
                  opacity: (appState === 'practicing' && currentStep?.ring === 'outer') ? 1 : 0.08,
                  transition: 'stroke-dashoffset 0.1s linear'
                }}
              />
              <circle cx="100" cy="100" r="68" fill="none" stroke="#ffffff" strokeWidth="6" className="opacity-[0.04]" />

              {/* Middle Ring */}
              <circle
                cx="100" cy="100" r="52"
                fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round"
                style={{
                  strokeDasharray: `${2 * Math.PI * 52}`,
                  strokeDashoffset: (appState === 'practicing' && currentStep?.ring === 'middle') 
                    ? (2 * Math.PI * 52 * (1 - phaseProgress)) 
                    : 2 * Math.PI * 52,
                  opacity: (appState === 'practicing' && currentStep?.ring === 'middle') ? 1 : 0.08,
                  transition: 'stroke-dashoffset 0.1s linear'
                }}
              />
              <circle cx="100" cy="100" r="52" fill="none" stroke="#ffffff" strokeWidth="6" className="opacity-[0.04]" />

              {/* Inner Ring */}
              <circle
                cx="100" cy="100" r="36"
                fill="none" stroke="#ffffff" strokeWidth="6" strokeLinecap="round"
                style={{
                  strokeDasharray: `${2 * Math.PI * 36}`,
                  strokeDashoffset: (appState === 'practicing' && (currentStep?.ring === 'inner' || currentStep?.ring === 'all')) 
                    ? (2 * Math.PI * 36 * (1 - phaseProgress)) 
                    : 2 * Math.PI * 36,
                  opacity: (appState === 'practicing' && (currentStep?.ring === 'inner' || currentStep?.ring === 'all')) ? 1 : 0.08,
                  transition: 'stroke-dashoffset 0.1s linear'
                }}
              />
              <circle cx="100" cy="100" r="36" fill="none" stroke="#ffffff" strokeWidth="6" className="opacity-[0.04]" />
            </svg>

            {/* Hand Movement Visual Guide Overlay for Morning Recharge (Bhastrika) */}
            {appState === 'practicing' && currentStep?.showHands && (
              <div className="absolute inset-0 z-20 flex flex-col items-center justify-between py-6 pointer-events-none">
                <div className={`transition-all duration-300 flex flex-col items-center ${bhastrikaSubPhase === 'up' ? 'animate-hands-up text-[#ffdd57]' : 'animate-hands-down text-[#ffa62b]'}`}>
                  <svg className="w-10 h-10 drop-shadow-[0_0_10px_rgba(255,221,87,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    {bhastrikaSubPhase === 'up' ? (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 11l7-7 7 7M5 19l7-7 7 7" />
                    ) : (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M19 13l-7 7-7-7M19 5l-7 7-7-7" />
                    )}
                  </svg>
                  <span className="text-[10px] font-black uppercase tracking-widest bg-[#12141c]/90 px-2 py-0.5 rounded border border-white/20 mt-1">
                    {bhastrikaSubPhase === 'up' ? '🙌 HANDS UP (INHALE)' : '👇 HANDS DOWN (EXHALE)'}
                  </span>
                </div>
              </div>
            )}

            {/* Center Interactive Button */}
            <button
              onClick={handleCenterTap}
              onTouchStart={() => setIsPressingButton(true)}
              onTouchEnd={() => setIsPressingButton(false)}
              onMouseDown={() => setIsPressingButton(true)}
              onMouseUp={() => setIsPressingButton(false)}
              className={`
                relative z-10 w-24 h-24 rounded-full bg-[#ffa62b] text-[#12141c] font-extrabold text-xs tracking-wider
                border-4 border-[#12141c] select-none outline-none transition-transform duration-100 active:scale-95
                flex items-center justify-center text-center p-2 shadow-[0_0_30px_rgba(255,166,43,0.4)]
                ${appState === 'reward' ? 'bg-gradient-to-r from-[#ffdd57] to-[#ffa62b] text-[#12141c] scale-105' : ''}
              `}
              style={{
                boxShadow: isPressingButton 
                  ? '0 0 50px #ffa62b, inset 0 0 15px rgba(0,0,0,0.4)' 
                  : hapticRipple === 'sharp' 
                    ? '0 0 40px #ffa62b' 
                    : hapticRipple === 'smooth' 
                      ? '0 0 25px rgba(255,166,43,0.8)' 
                      : '0 0 30px rgba(255,166,43,0.3)'
              }}
            >
              {hapticRipple === 'sharp' && (
                <span className="absolute inset-0 rounded-full border-4 border-[#ffdd57] animate-ping opacity-75" />
              )}
              {hapticRipple === 'smooth' && (
                <span className="absolute inset-[-12px] rounded-full border border-[#ffa62b]/40 animate-pulse" />
              )}
              <span className="relative z-10 uppercase leading-tight font-black">{getCenterButtonText()}</span>
            </button>

            {/* Routine Menu Modal */}
            {appState === 'menu' && (
              <div className="absolute inset-0 z-30 flex flex-col items-center justify-between p-3.5 bg-[#12141c]/95 backdrop-blur-lg rounded-3xl border border-white/10 shadow-2xl animate-fade-in overflow-y-auto">
                <p className="text-xs font-extrabold text-[#ffa62b] tracking-widest uppercase mb-1">Routines</p>
                
                <div className="w-full space-y-1.5 my-auto">
                  {Object.values(ROUTINES).map((rt) => (
                    <button
                      key={rt.id}
                      onClick={() => startRoutine(rt.id)}
                      className="w-full text-left p-2 rounded-xl border border-white/10 bg-[#1e2230]/80 hover:bg-[#1e2230] transition-all flex items-center justify-between group"
                    >
                      <div>
                        <div className="text-xs font-bold text-white group-hover:text-[#ffa62b] transition-colors">{rt.title}</div>
                        <div className="text-[10px] text-[#d1d5db]/70">{rt.subtitle}</div>
                      </div>
                      <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: rt.color }} />
                    </button>
                  ))}

                  <button
                    onClick={() => setAppState('bolt_instructions')}
                    className="w-full text-left p-2 rounded-xl border border-[#ffa62b]/30 bg-[#ffa62b]/10 hover:bg-[#ffa62b]/20 transition-all flex items-center justify-between"
                  >
                    <div>
                      <div className="text-xs font-bold text-[#ffa62b]">BOLT Score Test</div>
                      <div className="text-[10px] text-[#ffa62b]/80">Measure CO2 Tolerance</div>
                    </div>
                    <span className="text-xs text-[#ffa62b] font-bold">→</span>
                  </button>

                  <button
                    onClick={() => setAppState('playlist')}
                    className="w-full text-left p-2 rounded-xl border border-[#cc0000]/30 bg-[#cc0000]/10 hover:bg-[#cc0000]/20 transition-all flex items-center justify-between"
                  >
                    <div>
                      <div className="text-xs font-bold text-[#cc0000]">📺 Video Tutorials & Guides</div>
                      <div className="text-[10px] text-[#cc0000]/80">Watch YouTube Playlist</div>
                    </div>
                    <span className="text-xs text-[#cc0000] font-bold">▶</span>
                  </button>

                  <div className="p-2 rounded-xl border border-white/10 bg-[#1e2230]/60 flex items-center justify-between">
                    <span className="text-[11px] font-medium text-[#d1d5db]">Daily Target Sessions:</span>
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setDailyTarget(t => Math.max(1, t - 1))}
                        className="w-5 h-5 rounded bg-[#12141c] text-white text-xs font-bold flex items-center justify-center hover:bg-neutral-800"
                      >-</button>
                      <span className="text-xs font-bold text-[#ffa62b] w-3 text-center">{dailyTarget}</span>
                      <button 
                        onClick={() => setDailyTarget(t => Math.min(8, t + 1))}
                        className="w-5 h-5 rounded bg-[#12141c] text-white text-xs font-bold flex items-center justify-center hover:bg-neutral-800"
                      >+</button>
                    </div>
                  </div>

                  <button
                    onClick={resetProgressData}
                    className="w-full py-1 text-[10px] text-[#d1d5db]/60 hover:text-[#cc0000] transition-colors text-center"
                  >
                    Reset Saved Progress
                  </button>
                </div>

                <button
                  onClick={handleCenterTap}
                  className="mt-1 text-[10px] font-bold text-[#d1d5db]/70 uppercase tracking-widest hover:text-white"
                >
                  Close Menu
                </button>
              </div>
            )}

            {/* YouTube Playlist Modal */}
            {appState === 'playlist' && (
              <div className="absolute inset-0 z-30 flex flex-col items-center justify-between p-3 bg-[#12141c]/95 backdrop-blur-lg rounded-3xl border border-[#cc0000]/30 shadow-2xl animate-fade-in text-center">
                <div className="w-full flex-1 flex flex-col justify-between">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-extrabold text-[#cc0000] uppercase tracking-wider">Video Playlist</span>
                    <a 
                      href={YOUTUBE_PLAYLIST_URL} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="text-[10px] font-bold text-[#d1d5db] bg-[#1e2230] hover:bg-neutral-800 px-2.5 py-1 rounded-lg border border-white/10 flex items-center gap-1"
                    >
                      <span>Open App</span>
                      <span className="text-[#cc0000]">↗</span>
                    </a>
                  </div>

                  <div className="w-full h-44 rounded-xl overflow-hidden border border-white/10 bg-black shadow-inner">
                    <iframe
                      src={YOUTUBE_EMBED_URL}
                      title="Savitu Breathing Video Playlist"
                      className="w-full h-full border-0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowFullScreen
                    ></iframe>
                  </div>
                </div>

                <button
                  onClick={handleCenterTap}
                  className="w-full mt-2 py-1.5 rounded-xl text-xs font-bold bg-[#1e2230] text-[#d1d5db] hover:bg-neutral-800"
                >
                  Back to Menu
                </button>
              </div>
            )}

            {/* BOLT Test Instructions Modal */}
            {appState === 'bolt_instructions' && (
              <div className="absolute inset-0 z-30 flex flex-col items-center justify-between p-4 bg-[#12141c]/95 backdrop-blur-lg rounded-3xl border border-[#ffa62b]/30 shadow-2xl animate-fade-in text-center">
                <div className="w-full">
                  <h3 className="text-sm font-extrabold text-[#ffa62b] uppercase tracking-wider mb-2">BOLT Score Instructions</h3>
                  <div className="text-left text-xs text-[#d1d5db] space-y-1.5 bg-[#1e2230] p-2.5 rounded-xl border border-white/5">
                    <p className="flex items-start gap-1.5">
                      <span className="font-bold text-[#ffa62b]">1.</span>
                      <span>Take <strong>3 deep breaths</strong> through your nose.</span>
                    </p>
                    <p className="flex items-start gap-1.5">
                      <span className="font-bold text-[#ffa62b]">2.</span>
                      <span>At the end of the <strong>3rd last exhale</strong>, hold your breath and press the center button.</span>
                    </p>
                    <p className="flex items-start gap-1.5">
                      <span className="font-bold text-[#ffa62b]">3.</span>
                      <span>Press the button again to <strong>stop</strong> at first definite urge to breathe.</span>
                    </p>
                  </div>
                </div>

                <div className="flex gap-2 w-full mt-2">
                  <button
                    onClick={() => setAppState('menu')}
                    className="w-1/2 py-1.5 rounded-xl text-xs font-bold bg-[#1e2230] text-[#d1d5db] hover:bg-neutral-800"
                  >
                    Back
                  </button>
                  <button
                    onClick={handleCenterTap}
                    className="w-1/2 py-1.5 rounded-xl text-xs font-bold bg-[#ffa62b] text-[#12141c] hover:bg-opacity-90"
                  >
                    Start Prep
                  </button>
                </div>
              </div>
            )}
          </div>

          <div className="w-full max-w-sm text-center mb-1">
            {appState === 'idle' && (
              <p className="text-[11px] text-[#d1d5db]/50">
                Tap center button to open menu. Sessions and weekly rainbow progress are saved automatically.
              </p>
            )}

            {appState === 'practicing' && currentStep?.technique === 'vibhagiya' && (
              <div className="text-xs text-[#ffa62b] bg-[#ffa62b]/10 py-1.5 px-3 rounded-lg border border-[#ffa62b]/20">
                💡 <strong>Centering (Vibhagiya):</strong> Fill belly first, then ribcage, then upper chest.
              </div>
            )}

            {appState === 'practicing' && activeRoutineKey === 'recharge' && currentStep?.phase === 'bhastrika' && (
              <div className="text-xs text-[#ffdd57] bg-[#ffdd57]/10 py-1.5 px-3 rounded-lg border border-[#ffdd57]/20">
                ⚡ <strong>Hands Guide:</strong> Raise arms overhead on inhale, drive elbows down to ribs on exhale!
              </div>
            )}

            {appState === 'practicing' && activeRoutineKey === 'sleep' && (
              <div className="text-xs text-[#7209b7] bg-[#7209b7]/20 py-1.5 px-3 rounded-lg border border-[#7209b7]/30">
                🌙 <strong>Posture Tip:</strong> Recommended lying down or with legs up the wall.
              </div>
            )}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
